# Netlify configuration for the State Civic Intelligence static dashboard.
#
# The site is pre-generated by scripts/site_builder.py during each pipeline run
# and lives in ./site. There is no build step for Netlify to run — it just
# serves the folder as-is. The pipeline publishes it with:
#     netlify deploy --prod --dir=site --site=<id>   (CLI auto-deploy)
#
# This file mainly matters if you ever switch to git-based deploys: it tells
# Netlify the publish directory and that there's nothing to build.

[build]
  publish = "site"
  command = ""

# Lightweight, privacy-respecting headers. The pages already carry
# <meta name="robots" content="noindex"> so search engines don't index this
# internal monitoring dashboard; this header reinforces it at the HTTP level.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
